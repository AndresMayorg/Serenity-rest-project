serenity {
    project.name = "Serenity REST API Tests"
    test.root = "com.automation"
    report {
        show.manual.tests = true
        encoding = "UTF-8"
    }
    logging = "VERBOSE"
    verbosity = "VERBOSE"
}

base.url = "https://opensource-demo.orangehrmlive.com"

environments {
    default {
        base.url = "https://opensource-demo.orangehrmlive.com"
    }
    staging {
        base.url = "https://staging-demo.orangehrmlive.com"
    }
}