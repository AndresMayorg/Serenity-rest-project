name: Serenity Rest - API CI Pipeline

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  run_api_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run API Tests
        run: mvn clean verify serenity:aggregate

      - name: Upload API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-serenity-report
          path: target/site/serenity/